<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Bg circle -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>

  <!-- Antenna -->
  <rect x="47" y="11" width="6" height="14" rx="3" fill="#3b82f6"/>
  <circle cx="50" cy="9" r="5" fill="#2563eb"/>

  <!-- Head -->
  <rect x="26" y="24" width="48" height="36" rx="10" fill="url(#face)"/>

  <!-- Eye sockets (dark) -->
  <rect x="32" y="34" width="14" height="10" rx="5" fill="#dbeafe"/>
  <rect x="54" y="34" width="14" height="10" rx="5" fill="#dbeafe"/>

  <!-- Eye glow -->
  <rect x="34" y="36" width="10" height="6" rx="3" fill="#1e40af"/>
  <rect x="56" y="36" width="10" height="6" rx="3" fill="#1e40af"/>

  <!-- Mouth -->
  <rect x="36" y="49" width="28" height="5" rx="2.5" fill="#dbeafe" opacity="0.6"/>
  <rect x="36" y="49" width="16" height="5" rx="2.5" fill="#dbeafe"/>

  <!-- Neck -->
  <rect x="44" y="60" width="12" height="7" rx="3" fill="url(#body)"/>

  <!-- Body -->
  <rect x="22" y="67" width="56" height="26" rx="12" fill="url(#body)"/>

  <!-- Chest detail -->
  <circle cx="50" cy="80" r="8" fill="#1e3a8a"/>
  <circle cx="50" cy="80" r="5" fill="#93c5fd" opacity="0.9"/>

  <!-- Shoulder bolts -->
  <circle cx="29" cy="73" r="4" fill="#1e3a8a"/>
  <circle cx="71" cy="73" r="4" fill="#1e3a8a"/>
</svg>
