<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Light theme: white bg circle with blue robot -->
  
  <defs>
    <radialGradient id="bgGradL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </radialGradient>
    <radialGradient id="eyeGlowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="49" fill="url(#bgGradL)" stroke="#93c5fd" stroke-width="1.5"/>
  
  <!-- Trend arrow up (background element) -->
  <polyline points="18,68 32,52 44,60 62,38" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>
  <polygon points="58,32 68,36 64,46" fill="#3b82f6" opacity="0.25"/>
  
  <!-- Robot head -->
  <!-- Antenna -->
  <line x1="50" y1="22" x2="50" y2="30" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="20" r="3" fill="#2563eb"/>
  
  <!-- Head shape -->
  <rect x="33" y="30" width="34" height="26" rx="7" ry="7" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  
  <!-- Eyes -->
  <rect x="38" y="38" width="9" height="6" rx="3" fill="url(#eyeGlowL)"/>
  <rect x="53" y="38" width="9" height="6" rx="3" fill="url(#eyeGlowL)"/>
  
  <!-- Mouth / status bar -->
  <rect x="40" y="50" width="20" height="3" rx="1.5" fill="#93c5fd"/>
  <rect x="40" y="50" width="12" height="3" rx="1.5" fill="#2563eb"/>
  
  <!-- Neck -->
  <rect x="45" y="56" width="10" height="5" rx="2" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
  
  <!-- Body -->
  <rect x="30" y="61" width="40" height="20" rx="6" ry="6" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  
  <!-- Chest bitcoin -->
  <text x="50" y="76" font-family="Arial" font-size="10" font-weight="bold" fill="#d97706" text-anchor="middle">₿</text>
  
  <!-- Shoulders -->
  <rect x="30" y="61" width="10" height="8" rx="4" fill="#93c5fd" opacity="0.8"/>
  <rect x="60" y="61" width="10" height="8" rx="4" fill="#93c5fd" opacity="0.8"/>
</svg>
