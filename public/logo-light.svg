<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" role="img" aria-labelledby="logo-light-title">
  <title id="logo-light-title">Trading Auto Pilot</title>
  <defs>
    <linearGradient id="l-frame" x1="14" y1="10" x2="84" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1986FF" />
      <stop offset="1" stop-color="#00C67F" />
    </linearGradient>
    <linearGradient id="l-blue" x1="16" y1="20" x2="61" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1986FF" />
      <stop offset="1" stop-color="#0A5ACF" />
    </linearGradient>
    <linearGradient id="l-green" x1="32" y1="72" x2="82" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00A86B" />
      <stop offset="1" stop-color="#5BE89A" />
    </linearGradient>
    <filter id="l-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(0 0)">
    <rect x="3" y="3" width="90" height="90" rx="24" fill="#F8FAFC" stroke="url(#l-frame)" stroke-opacity=".18" stroke-width="1.5" />
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#l-glow)">
      <path d="M15 24h31M30.5 24v48" stroke="url(#l-blue)" stroke-width="5.5" />
      <path d="M37 72 50 27l14 45M42 56h16" stroke="url(#l-blue)" stroke-width="5.5" />
      <path d="M61 27h10c15 0 15 23 0 23H61v22" stroke="url(#l-blue)" stroke-width="5.5" />
      <path d="m29 70 17-17 9 7 24-40" stroke="url(#l-green)" stroke-width="6" />
      <path d="m79 20 1 20M80 20 61 25" stroke="url(#l-green)" stroke-width="6" />
    </g>
    <circle cx="80" cy="20" r="3" fill="#5BE89A" />
  </g>
  <text x="112" y="56" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800" letter-spacing="-1.2">TRADING AUTO PILOT</text>
  <text x="114" y="78" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="2.8">AUTONOMOUS TRADING SYSTEM</text>
