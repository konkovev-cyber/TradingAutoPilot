<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" role="img" aria-labelledby="title desc">
  <title id="title">Trading Auto Pilot</title>
  <desc id="desc">Неоновый монограммный логотип Trading Auto Pilot</desc>
  <defs>
    <linearGradient id="frame" x1="14" y1="10" x2="84" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19C5FF" />
      <stop offset="1" stop-color="#00F08B" />
    </linearGradient>
    <linearGradient id="blue" x1="16" y1="20" x2="61" y2="76" gradientUnits="userSpaceOnUse">
